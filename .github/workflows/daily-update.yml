name: Daily VPIN Data Update

on:
  schedule:
    # 北京时间 17:00 (UTC+8) = UTC 09:00
    # 国债期货 15:15 收盘，给 Tushare API 留足数据落地时间
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      end_date:
        description: '强制截止日期 (YYYYMMDD)，留空则自动取最新已完成交易日'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 完整历史以便后续 commit/push
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: bash scripts/run_daily_update.sh
        # 非交易日会自然失败（没有新数据），但我们仍要检查已有产出一致性

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-log
          path: scripts/logs/*.log
          retention-days: 30

      - name: Check for changes
        id: git-check
        if: always()
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
            git diff --stat
          fi

      - name: Commit and push updates
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md data/ results/ scripts/logs/
          COMMIT_MSG="data: daily update $(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
          git commit -m "$COMMIT_MSG"
          git push
